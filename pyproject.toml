[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "rareevent"
version = "0.1.0"
description = "Fast rare event simulation (crude Monte Carlo, importance sampling, splitting) with a C++ core and Python API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "avi-nz" }]
keywords = ["rare event simulation", "monte carlo", "importance sampling", "splitting", "probability"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/avi-nz/Rare-Event-Simulation-Framework"
Issues = "https://github.com/avi-nz/Rare-Event-Simulation-Framework/issues"

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.version = ">=3.20"
wheel.packages = ["python/rareevent"]

[tool.scikit-build.cmake.define]
RAREEVENT_BUILD_PYTHON = "ON"
RAREEVENT_BUILD_TESTS = "OFF"
RAREEVENT_BUILD_BENCHMARKS = "OFF"

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.cibuildwheel]
test-extras = ["test"]
test-command = "pytest {project}/tests/python"
